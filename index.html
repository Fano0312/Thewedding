<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Undangan Pernikahan</title>

  <!-- Font huruf tali -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Times New Roman', serif;
      background-color: #e8d2ae;
      color: #333;
    }

    /* ===== SPLASH ===== */
    .splash {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url('gereja.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      text-align: center;
      padding: 20px;
      overflow-y: auto;
      color: #5a3e2b;
      text-shadow: 0 0 5px rgba(255,255,255,0.8);
    }

    .photo-frame {
      position: relative;
      width: 320px;
      height: 320px;
      margin-bottom: 25px;
    }

    .photo-frame .bingkai {
      position: absolute;
      top: 0;
      left: 0;
      width: 320px;
      height: 320px;
      z-index: 2;
      pointer-events: none;
    }

    .photo-frame .foto {
      position: absolute;
      top: 32px;
      left: 32px;
      width: 256px;
      height: 256px;
      border-radius: 50%;
      object-fit: cover;
      z-index: 1;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .splash p {
      font-size: 18px;
      color: #5a3e2b;
      max-width: 600px;
      font-weight: normal;
      margin-bottom: 20px;
    }

    .splash button,
    .gallery button,
    .content .btn-lanjut {
      padding: 12px 24px;
      font-size: 16px;
      background-color: #5a3e2b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      z-index: 11;
    }

    .corner-decor {
      position: absolute;
      width: 150px;
      height: 150px;
      background-repeat: no-repeat;
      background-size: contain;
      z-index: 0;
      background-image: url('bunga.png');
    }

    .top-left { top: 0; left: 0; }
    .top-right { top: 0; right: 0; }
    .bottom-left { bottom: 0; left: 0; }
    .bottom-right { bottom: 0; right: 0; }

    /* ===== GALERI ===== */
    .gallery {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #e8d2ae;
      z-index: 9;
      overflow-y: auto;
      padding: 40px 0 60px;
      text-align: center;
    }

    .gallery .judul-sagoe {
      margin-top: 10px;
    }

    .gallery-sub {
      font-size: 15px;
      color: #6b4a30;
      max-width: 500px;
      margin: 0 auto 30px;
      line-height: 1.6;
    }

    .gallery-grid {
      display: flex;
      flex-direction: column;
      gap: 0;
      width: 100%;
      margin: 0 auto 35px;
    }

    .gallery-grid img {
      width: 100%;
      height: 90vw;
      max-height: 520px;
      object-fit: contain;
      object-position: center;
      background-color: #d8bd93;
      border-radius: 0;
      box-shadow: none;
      border: none;
      border-bottom: 4px solid #fff;
      cursor: pointer;
      opacity: 0;
      transition: transform 1.8s cubic-bezier(0.25, 0.1, 0.25, 1), opacity 1.8s ease;
    }
